<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LMS</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Cairo (Arabic UI) and Inter (English UI): both OFL, Google Fonts. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/lms-theme.css" />
    <link rel="stylesheet" href="css/lms-stitch.css" />
    <link rel="stylesheet" href="css/lms-activities.css" />
    <script src="js/theme.js"></script>
    <script src="js/nav.js"></script>
    <link rel="icon" type="image/png" href="favicon.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="loading-progress-text">LMS …</div>
    </div>

    <div id="blazor-error-ui">
        حدث خطأ غير متوقع / An unhandled error has occurred.
        <a href="." class="reload">إعادة تحميل / Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="js/download.js"></script>
    <script src="js/form-flush.js"></script>
    <script src="js/dialog-focus.js"></script>
    <script src="_content/Microsoft.AspNetCore.Components.WebAssembly.Authentication/AuthenticationService.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js" autostart="false"></script>
    <script>
        // Culture is chosen before Blazor starts: ar (default, RTL) or en. Persisted by CultureService as lms.culture.
        (function () {
            var c = localStorage.getItem('lms.culture');
            if (c !== 'ar' && c !== 'en') c = 'ar';
            document.documentElement.lang = c;
            document.documentElement.dir = c === 'ar' ? 'rtl' : 'ltr';
            var opts = { applicationCulture: c };
            // Starting Blazor manually ignores the server's Blazor-Environment header (launchSettings: Standalone),
            // so pass it on explicitly; hosts that do not send the header keep the default environment.
            fetch('_framework/blazor.boot.json', { method: 'HEAD' })
                .then(function (r) { var env = r.headers.get('Blazor-Environment'); if (env) opts.environment = env; })
                .catch(function () { })
                .then(function () { Blazor.start(opts); });
        })();
    </script>
</body>

</html>
