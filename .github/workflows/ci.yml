name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    # Docs-only pushes to main (STATUS, PRD, plans, screenshots) don't touch code; skipping them keeps the
    # shared runner pool for PR builds. PR runs are unchanged, so required checks still report on every PR.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Unit and client tests, plus the full-solution build with warnings as errors (the only place the whole solution is built here).
  unit-and-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Packages.props
      - name: Build
        run: dotnet build LMS.slnx -c Release
      - name: Unit tests
        run: dotnet test tests/Lms.UnitTests -c Release --no-build
      - name: Client tests
        run: dotnet test tests/Lms.Client.Tests -c Release --no-build

  # The integration suite is one xUnit collection on one pair of containers, so it is serial; it is split by test class over shards, each
  # on its own runner and containers (see .github/scripts/shard_tests.py; weighted by test count until timings exist: run .github/scripts/trx_weights.py on the integration-trx artifacts).
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # Each WebApplicationFactory host watches appsettings files; with many hosts the runner's default of
      # 128 inotify instances runs out ("The configured user limit (128) on the number of inotify instances").
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
      SHARD_COUNT: "4"
    steps:
      - name: Raise inotify limits
        run: |
          sudo sysctl -w fs.inotify.max_user_instances=8192
          sudo sysctl -w fs.inotify.max_user_watches=524288
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Packages.props
      - name: Build the integration tests
        run: dotnet build tests/Lms.IntegrationTests -c Release
      - name: Choose this shard's test classes
        id: shard
        run: |
          python3 .github/scripts/shard_tests.py tests/Lms.IntegrationTests 0 "$SHARD_COUNT" -- -c Release --no-build
          FILTER=$(python3 .github/scripts/shard_tests.py tests/Lms.IntegrationTests ${{ matrix.shard }} "$SHARD_COUNT" -- -c Release --no-build)
          echo "filter=$FILTER" >> "$GITHUB_OUTPUT"
      - name: Integration tests (Testcontainers), shard ${{ matrix.shard }}
        env:
          LMS_PERF_BUDGET_FACTOR: "3" # shared runners are about 2x slower than a developer machine (X-09 budget scales)
          LMS_CONN_LOG: ${{ runner.temp }}/mysql-connections.log # #466: MySQL connections by user/query every 15 s
        run: dotnet test tests/Lms.IntegrationTests -c Release --no-build --filter "${{ steps.shard.outputs.filter }}" --logger "trx;LogFileName=integration-${{ matrix.shard }}.trx" --results-directory TestResults
      - name: Upload MySQL connection samples
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-connections-${{ matrix.shard }}
          path: ${{ runner.temp }}/mysql-connections.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-trx-${{ matrix.shard }}
          path: TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 7

  # The required check keeps its old name: it passes only when every part above passed.
  build-and-test:
    runs-on: ubuntu-latest
    needs: [unit-and-client, integration]
    if: always()
    steps:
      - name: All test jobs passed
        run: |
          echo "unit-and-client: ${{ needs.unit-and-client.result }}"
          echo "integration: ${{ needs.integration.result }}"
          [ "${{ needs.unit-and-client.result }}" = "success" ] && [ "${{ needs.integration.result }}" = "success" ]

  e2e:
    runs-on: ubuntu-latest
    # Starts with the integration shards instead of after them (it builds the API itself); a red unit run stops it first.
    needs: unit-and-client
    # The 1 h E2E job runs for main and for PRs marked ready; drafts skip it to keep the runner queue short.
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    env:
      ASPNETCORE_ENVIRONMENT: Development
      LMS_E2E_BASEURL: http://localhost:5132
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Packages.props
      - name: Build API and E2E tests
        run: |
          dotnet build src/Lms.Api -c Release
          dotnet build tests/Lms.E2ETests -c Release
      # Mailpit receives the invitation and reset emails the M1 E2E tests read (MailpitClient, :8025).
      # mock-oidc is the external OpenID Connect provider of the M2 external-login E2E (navikt/mock-oauth2-server, :8090).
      - name: Start MySQL, MinIO, Mailpit and the mock OpenID Connect provider
        run: |
          docker compose up -d --wait mysql minio mailpit mock-oidc
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8090/client-a/.well-known/openid-configuration > /dev/null; then echo "mock-oidc ready after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "mock-oidc did not become ready"; docker compose logs mock-oidc; exit 1
      # In Development the API applies migrations and seeds the dev data (#14) at startup.
      - name: Start the API in Development
        env:
          # All E2E logins come from one IP; the 5/min auth rate limit (#82) would turn the lockout test into 429s.
          RateLimiting__Auth__PermitLimit: "1000"
        run: |
          nohup dotnet run --project src/Lms.Api -c Release --no-build --no-launch-profile --urls "$LMS_E2E_BASEURL" > api.log 2>&1 &
          for i in $(seq 1 90); do
            if [ "$(curl -s "$LMS_E2E_BASEURL/health")" = "Healthy" ]; then echo "API healthy after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "API did not become healthy"; cat api.log; exit 1
      # The browser download is the slow part of the install; cached by the Playwright package version.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
      - name: Install Playwright Chromium
        # The runner's apt mirrors intermittently fail DNS ("Temporary failure resolving"), and apt can then hang.
        # Try with system deps twice (time-boxed); otherwise install the browser alone: ubuntu-latest images already
        # ship the libraries Chromium needs.
        timeout-minutes: 15
        run: |
          PW=tests/Lms.E2ETests/bin/Release/net10.0/playwright.ps1
          for attempt in 1 2; do
            if timeout 300 pwsh $PW install --with-deps chromium; then exit 0; fi
            echo "Playwright install with deps failed (attempt $attempt)"
            [ "$attempt" -lt 2 ] && sleep 30
          done
          echo "Falling back to installing Chromium without system deps"
          pwsh $PW install chromium
      - name: Run E2E tests
        run: dotnet test tests/Lms.E2ETests -c Release --no-build --logger "trx;LogFileName=e2e.trx" --results-directory TestResults
      - name: Upload E2E traces, screenshots and API log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            TestResults/
            api.log
          retention-days: 7
