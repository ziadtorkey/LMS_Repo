<style>
/* ---------- Stitch tokens as LmsTheme.cs and lms-stitch.css set them (main after #560) ---------- */
:root {
  --mud-palette-primary:#00663D; --mud-palette-primary-text:#FFFFFF; --mud-palette-info:#1E40AF; --mud-palette-success:#1D7344;
  --mud-palette-warning:#B45309; --mud-palette-error:#B42318; --mud-palette-background:#F8FAFC; --mud-palette-background-gray:#F1F5F9;
  --mud-palette-surface:#FFFFFF; --mud-palette-text-primary:#0B1C30; --mud-palette-text-secondary:#475569;
  --mud-palette-action-default:#475569; --mud-palette-action-disabled:rgba(11,28,48,.32); --mud-palette-action-disabled-background:rgba(11,28,48,.08);
  --mud-palette-lines-default:#E2E8F0; --mud-palette-lines-inputs:#7A8793; --mud-palette-table-lines:#F1F5F9; --mud-palette-overlay-dark:rgba(11,28,48,.45);
  --lms-accent:#10B981; --lms-recessed:#EFF4FF; --lms-radius-control:8px; --lms-radius-surface:12px;
  --lms-shadow-1:0 1px 3px 0 rgba(0,0,0,.04), 0 1px 2px -1px rgba(0,0,0,.02); --lms-shadow-2:0 10px 25px -5px rgba(0,0,0,.08), 0 8px 10px -6px rgba(0,0,0,.04);
  --lms-focus-ring:0 0 0 2px var(--mud-palette-surface), 0 0 0 4px var(--mud-palette-primary);
}
:root[data-theme=dark] {
  --mud-palette-primary:#4CC38A; --mud-palette-primary-text:#032013; --mud-palette-info:#60A5FA; --mud-palette-success:#34D399;
  --mud-palette-warning:#FBBF24; --mud-palette-error:#F87171; --mud-palette-background:#090D10; --mud-palette-background-gray:#16202A;
  --mud-palette-surface:#121A20; --mud-palette-text-primary:#E2E8F0; --mud-palette-text-secondary:#94A3B8;
  --mud-palette-action-default:#94A3B8; --mud-palette-action-disabled:rgba(226,232,240,.3); --mud-palette-action-disabled-background:rgba(226,232,240,.1);
  --mud-palette-lines-default:#1E293B; --mud-palette-lines-inputs:#6A7B85; --mud-palette-table-lines:#1E293B; --mud-palette-overlay-dark:rgba(0,0,0,.6);
  --lms-recessed:#16202A; --lms-shadow-1:0 1px 3px 0 rgba(0,0,0,.35), 0 1px 2px -1px rgba(0,0,0,.25); --lms-shadow-2:0 10px 25px -5px rgba(0,0,0,.55), 0 8px 10px -6px rgba(0,0,0,.35);
}
* { box-sizing:border-box; }
body { margin:0; background:var(--mud-palette-background); color:var(--mud-palette-text-primary); font-family:Inter, Cairo, system-ui, sans-serif; font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased; }
:root[lang=ar] body { font-family:Cairo, Inter, system-ui, sans-serif; }
.ms { font-family:'Material Symbols Rounded'; font-weight:normal; font-style:normal; font-size:20px; line-height:1; display:inline-block; vertical-align:middle; user-select:none; }
.ms-sm { font-size:18px; }
[dir=rtl] .flip { transform:scaleX(-1); }
h1,h2,h3,p { margin:0; }
.ltr { direction:ltr; unicode-bidi:isolate; }
.muted { color:var(--mud-palette-text-secondary); }
.caption { font-size:12.5px; }
.vh { position:absolute; inline-size:1px; block-size:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }

/* ---------- shell: sidebar (Stitch groups), glass app bar ---------- */
.shell { display:grid; grid-template-columns:260px minmax(0,1fr); min-height:100vh; }
.side { background:var(--mud-palette-surface); border-inline-end:1px solid var(--mud-palette-lines-default); padding:20px 12px; }
.brand { display:flex; align-items:center; gap:10px; padding:0 8px 16px; font-weight:700; }
.brand-mark { inline-size:36px; block-size:36px; border-radius:10px; background:var(--mud-palette-primary); color:var(--mud-palette-primary-text); display:grid; place-items:center; }
.nav-sec { font-size:12px; font-weight:600; color:var(--mud-palette-text-secondary); padding:14px 12px 4px; }
.nav { display:flex; align-items:center; gap:12px; padding:9px 12px; border-radius:var(--lms-radius-control); font-size:14px; }
.nav[aria-current] { background:var(--mud-palette-primary); color:var(--mud-palette-primary-text); font-weight:600; }
.nav .badge { margin-inline-start:auto; }
.appbar { height:64px; display:flex; align-items:center; gap:12px; padding-inline:24px; }
.appbar .spacer { flex:1; }
.pill { display:inline-flex; align-items:center; gap:6px; height:36px; padding-inline:12px; border-radius:999px; background:var(--lms-recessed); font-size:13.5px; font-weight:500; }
.page { padding:8px 32px 32px; }
.icon-btn { inline-size:40px; block-size:40px; border-radius:50%; display:inline-grid; place-items:center; color:var(--mud-palette-action-default); position:relative; border:0; background:none; }
.icon-btn.sm { inline-size:32px; block-size:32px; }
.badge { min-inline-size:18px; height:18px; padding-inline:5px; border-radius:9px; background:var(--mud-palette-error); color:#fff; font-size:11px; font-weight:700; display:inline-grid; place-items:center; }
:root[data-theme=dark] .badge { color:#2A0603; }
.icon-btn .badge { position:absolute; inset-block-start:2px; inset-inline-end:0; }
.menu-btn { display:none; }

/* ---------- Stitch building blocks (lms-stitch.css) ---------- */
.ph { display:flex; flex-wrap:wrap; align-items:flex-end; gap:12px 20px; margin-block:8px 24px; }
.ph-text { flex:1 1 260px; min-inline-size:0; }
.h4 { font-family:Cairo, Inter, sans-serif; font-size:32px; font-weight:700; line-height:1.25; letter-spacing:-.01em; }
.h6 { font-family:Cairo, Inter, sans-serif; font-size:18px; font-weight:600; line-height:1.4; }
.sub { color:var(--mud-palette-text-secondary); font-size:14.5px; margin-block-start:4px; }
.card { background:var(--mud-palette-surface); border:1px solid var(--mud-palette-lines-default); border-radius:var(--lms-radius-surface); box-shadow:var(--lms-shadow-1); }
.card-head { display:flex; align-items:center; gap:12px; padding:16px 20px; border-block-end:1px solid var(--mud-palette-lines-default); }
.card-body { padding:16px 20px 20px; }
.sec-icon { inline-size:40px; block-size:40px; border-radius:10px; display:grid; place-items:center; flex:none; color:var(--mud-palette-primary); background:color-mix(in srgb, var(--mud-palette-primary) 10%, transparent); }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; height:40px; padding-inline:16px; border-radius:var(--lms-radius-control); font:inherit; font-size:14px; font-weight:600; border:1px solid transparent; background:none; color:var(--mud-palette-primary); white-space:nowrap; }
.btn-filled { background:var(--mud-palette-primary); color:var(--mud-palette-primary-text); }
.btn-outlined { border-color:var(--mud-palette-lines-default); background:var(--mud-palette-surface); color:var(--mud-palette-text-primary); }
.btn-error { color:var(--mud-palette-error); }
.btn-sm { height:32px; padding-inline:12px; font-size:13px; }
.btn[disabled] { background:var(--mud-palette-action-disabled-background); color:var(--mud-palette-action-disabled); border-color:transparent; }
.focus { box-shadow:var(--lms-focus-ring); }
.field { display:flex; flex-direction:column; gap:6px; min-inline-size:0; }
.label { font-size:13px; font-weight:500; }
.input { min-height:40px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:6px 12px; border-radius:var(--lms-radius-control); background:var(--lms-recessed); border:1px solid var(--mud-palette-lines-inputs); font-size:14px; color:var(--mud-palette-text-primary); }
.input.focused { border-color:var(--mud-palette-primary); box-shadow:0 0 0 3px color-mix(in srgb, var(--mud-palette-primary) 25%, transparent); }
.input .ph-text { color:var(--mud-palette-text-secondary); flex:1; }
.help { font-size:12.5px; color:var(--mud-palette-text-secondary); }
.chip { display:inline-flex; align-items:center; gap:5px; height:26px; padding-inline:10px; border-radius:999px; font-size:12.5px; font-weight:500; white-space:nowrap; background:var(--mud-palette-background-gray); color:var(--mud-palette-text-primary); }
.chip .ms { font-size:16px; }
.chip-dot::before { content:''; inline-size:6px; block-size:6px; border-radius:50%; background:currentColor; }
.chip-success { color:var(--mud-palette-success); background:color-mix(in srgb, var(--mud-palette-success) 12%, transparent); }
.chip-info { color:var(--mud-palette-info); background:color-mix(in srgb, var(--mud-palette-info) 12%, transparent); }
.chip-warning { color:var(--mud-palette-warning); background:color-mix(in srgb, var(--mud-palette-warning) 14%, transparent); }
.chip-error { color:var(--mud-palette-error); background:color-mix(in srgb, var(--mud-palette-error) 12%, transparent); }
.chip-input { background:var(--mud-palette-surface); border:1px solid var(--mud-palette-lines-default); }
.seg { display:flex; inline-size:fit-content; max-inline-size:100%; overflow-x:auto; gap:4px; padding:4px; border-radius:10px; background:var(--lms-recessed); }
.seg span { white-space:nowrap; padding:6px 14px; border-radius:var(--lms-radius-control); font-size:13.5px; font-weight:500; color:var(--mud-palette-text-secondary); }
.seg span[aria-selected] { background:var(--mud-palette-surface); color:var(--mud-palette-text-primary); box-shadow:var(--lms-shadow-1); }
.toggle-row { display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:var(--lms-radius-control); background:var(--lms-recessed); }
.toggle-row + .toggle-row { margin-block-start:12px; }
.toggle-row .t { flex:1; min-inline-size:0; } .toggle-row .t b { font-weight:500; display:block; }
.switch { inline-size:36px; block-size:20px; border-radius:10px; background:var(--mud-palette-lines-inputs); position:relative; flex:none; }
.switch::after { content:''; position:absolute; inset-block-start:2px; inset-inline-start:2px; inline-size:16px; block-size:16px; border-radius:50%; background:#fff; }
.switch.on { background:var(--mud-palette-primary); } .switch.on::after { inset-inline-start:18px; }
:root[data-theme=dark] .switch.on::after { background:var(--mud-palette-primary-text); }
.switch.locked { opacity:.55; }
.avatar { inline-size:40px; block-size:40px; border-radius:50%; display:grid; place-items:center; flex:none; font-size:14px; font-weight:600; background:color-mix(in srgb, var(--mud-palette-primary) 14%, transparent); color:var(--mud-palette-primary); }
.avatar.sm { inline-size:32px; block-size:32px; font-size:12px; }
.avatar.grp { background:color-mix(in srgb, var(--mud-palette-info) 14%, transparent); color:var(--mud-palette-info); }
.dot { inline-size:8px; block-size:8px; border-radius:50%; background:var(--lms-accent); flex:none; }
table { inline-size:100%; border-collapse:collapse; font-size:14px; }
th, td { overflow-wrap:anywhere; }
th { text-align:start; font-size:13px; font-weight:600; color:var(--mud-palette-text-secondary); background:var(--mud-palette-background-gray); padding:12px 16px; }
td .ltr { white-space:nowrap; }
td { padding:12px 16px; border-block-start:1px solid var(--mud-palette-table-lines); vertical-align:middle; }
tr.sel td { background:color-mix(in srgb, var(--mud-palette-primary) 6%, transparent); }
.alert { display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:var(--lms-radius-control); font-size:14px; border:1px solid currentColor; }
.alert-info { color:var(--mud-palette-info); background:color-mix(in srgb, var(--mud-palette-info) 6%, transparent); }
.alert-warning { color:var(--mud-palette-warning); background:color-mix(in srgb, var(--mud-palette-warning) 7%, transparent); }
.alert .t { color:var(--mud-palette-text-primary); }

/* ---------- M6 additions (proposed lms-stitch.css block; see the spec, section 8) ---------- */
.lms-inbox { display:grid; grid-template-columns:360px minmax(0,1fr); block-size:calc(100vh - 150px); min-block-size:560px; overflow:hidden; }
.lms-inbox-list { min-inline-size:0; border-inline-end:1px solid var(--mud-palette-lines-default); display:flex; flex-direction:column; min-block-size:0; }
.lms-inbox-tools { padding:12px; display:flex; flex-direction:column; gap:10px; border-block-end:1px solid var(--mud-palette-lines-default); }
.lms-convs { overflow:auto; flex:1; }
.lms-conv { display:flex; gap:12px; padding:12px 14px; border-block-end:1px solid var(--mud-palette-table-lines); align-items:flex-start; }
.lms-conv[aria-current] { background:color-mix(in srgb, var(--mud-palette-primary) 8%, transparent); box-shadow:inset 3px 0 0 var(--mud-palette-primary); }
[dir=rtl] .lms-conv[aria-current] { box-shadow:inset -3px 0 0 var(--mud-palette-primary); }
.lms-conv-main { flex:1; min-inline-size:0; }
.lms-conv-top { display:flex; gap:8px; align-items:baseline; }
.lms-conv-name { font-weight:500; flex:1; min-inline-size:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.lms-conv.unread .lms-conv-name, .lms-conv.unread .lms-conv-preview { font-weight:700; color:var(--mud-palette-text-primary); }
.lms-conv-preview { font-size:13.5px; color:var(--mud-palette-text-secondary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.lms-conv-side { display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
.lms-thread { display:flex; flex-direction:column; min-block-size:0; }
.lms-thread-head { display:flex; align-items:center; gap:12px; padding:12px 16px; border-block-end:1px solid var(--mud-palette-lines-default); }
.lms-thread-body { flex:1; overflow:auto; padding:16px 20px; display:flex; flex-direction:column; gap:10px; background:var(--mud-palette-background); }
.lms-day { align-self:center; font-size:12px; font-weight:600; color:var(--mud-palette-text-secondary); background:var(--mud-palette-background-gray); padding:2px 10px; border-radius:999px; margin-block:6px; }
.lms-msg { max-inline-size:min(560px, 80%); display:flex; flex-direction:column; gap:4px; }
.lms-msg-them { align-self:flex-start; }
.lms-msg-me { align-self:flex-end; align-items:flex-end; }
.lms-bubble { padding:10px 14px; border-radius:14px; background:var(--mud-palette-surface); border:1px solid var(--mud-palette-lines-default); font-size:14.5px; overflow-wrap:anywhere; }
.lms-msg-them .lms-bubble { border-start-start-radius:4px; }
.lms-msg-me .lms-bubble { background:color-mix(in srgb, var(--mud-palette-primary) 12%, var(--mud-palette-surface)); border-color:transparent; border-start-end-radius:4px; }
.lms-msg-meta { font-size:12px; color:var(--mud-palette-text-secondary); display:flex; gap:6px; align-items:center; }
.lms-msg-from { font-size:12.5px; font-weight:600; color:var(--mud-palette-text-secondary); }
.lms-attach { display:flex; align-items:center; gap:8px; margin-block-start:6px; padding:8px 10px; border-radius:var(--lms-radius-control); background:var(--lms-recessed); font-size:13px; }
.lms-msg-removed .lms-bubble { background:transparent; border-style:dashed; color:var(--mud-palette-text-secondary); font-style:italic; }
.lms-composer { display:flex; gap:8px; align-items:flex-end; padding:12px 16px; border-block-start:1px solid var(--mud-palette-lines-default); background:var(--mud-palette-surface); }
.lms-composer .input { flex:1; min-height:44px; }
.lms-composer-off { padding:12px 16px; border-block-start:1px solid var(--mud-palette-lines-default); background:var(--mud-palette-surface); }
.lms-menu { position:absolute; z-index:5; min-inline-size:220px; padding:6px; border-radius:var(--lms-radius-surface); background:var(--mud-palette-surface); border:1px solid var(--mud-palette-lines-default); box-shadow:var(--lms-shadow-2); }
.lms-menu div { display:flex; gap:10px; align-items:center; padding:9px 10px; border-radius:var(--lms-radius-control); font-size:14px; }
.lms-menu .err { color:var(--mud-palette-error); }
.lms-menu hr { border:0; border-block-start:1px solid var(--mud-palette-lines-default); margin:4px 0; }
.lms-picker-pop { margin-block-start:6px; border-radius:var(--lms-radius-surface); border:1px solid var(--mud-palette-lines-default); background:var(--mud-palette-surface); box-shadow:var(--lms-shadow-2); overflow:hidden; }
.lms-picker-group { font-size:12px; font-weight:600; color:var(--mud-palette-text-secondary); padding:10px 14px 4px; }
.lms-picker-opt { display:flex; gap:10px; align-items:center; padding:8px 14px; font-size:14px; }
.lms-picker-opt[aria-selected=true] { background:color-mix(in srgb, var(--mud-palette-primary) 8%, transparent); }
.lms-picker-opt[aria-disabled=true] { color:var(--mud-palette-text-secondary); }
.lms-picker-opt .grow { flex:1; min-inline-size:0; }
.dialog-wrap { position:relative; min-block-size:100vh; background:var(--mud-palette-overlay-dark); display:grid; place-items:start center; padding:48px 16px; }
.dialog { inline-size:min(640px, 100%); background:var(--mud-palette-surface); border-radius:var(--lms-radius-surface); box-shadow:var(--lms-shadow-2); }
.dialog-head { display:flex; align-items:center; gap:12px; padding:18px 24px 8px; }
.dialog-body { padding:8px 24px 16px; display:flex; flex-direction:column; gap:18px; }
.dialog-actions { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:8px; padding:12px 24px 20px; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.lms-ann-list { display:flex; flex-direction:column; gap:16px; max-inline-size:860px; }
.lms-ann { padding:18px 20px; }
.lms-ann.pinned { border-color:color-mix(in srgb, var(--mud-palette-primary) 35%, transparent); }
.lms-ann-top { display:flex; gap:12px; align-items:flex-start; }
.lms-ann-title { font-weight:600; font-size:16.5px; }
.lms-ann-meta { display:flex; flex-wrap:wrap; gap:6px 12px; font-size:13px; color:var(--mud-palette-text-secondary); margin-block-start:2px; }
.lms-ann-text { margin-block:10px 12px; font-size:14.5px; }
.lms-audience { display:flex; flex-wrap:wrap; gap:6px; }
.lms-notif-pop { position:absolute; inset-block-start:60px; inset-inline-end:84px; inline-size:400px; z-index:5; }
.lms-notif { display:flex; gap:12px; padding:12px 16px; border-block-end:1px solid var(--mud-palette-table-lines); }
.lms-notif.unread { background:color-mix(in srgb, var(--mud-palette-primary) 5%, transparent); }
.lms-notif .grow { flex:1; min-inline-size:0; font-size:14px; }
.lms-notif .grow b { font-weight:600; }
.lms-kind { inline-size:36px; block-size:36px; border-radius:10px; display:grid; place-items:center; flex:none; background:var(--lms-recessed); color:var(--mud-palette-primary); }
.lms-prefs td:not(:first-child), .lms-prefs th:not(:first-child) { text-align:center; }
.lms-chan-head { display:flex; flex-direction:column; align-items:center; gap:2px; }
.lms-mod { display:grid; grid-template-columns:minmax(0,1fr) 360px; gap:20px; align-items:start; }
.lms-context .lms-msg { max-inline-size:100%; }
.lms-flagged .lms-bubble { border:2px solid var(--mud-palette-warning); }
.lms-stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:16px; margin-block-end:20px; }
.lms-stat { display:flex; justify-content:space-between; gap:12px; padding:16px 20px; }
.lms-stat-label { font-size:13px; font-weight:500; color:var(--mud-palette-text-secondary); }
.lms-stat-value { font-size:28px; font-weight:700; line-height:1.2; }
.mobile-only { display:none; }

/* ---------- 360 px ---------- */
@media (max-width: 899.98px) {
  .shell { grid-template-columns:minmax(0,1fr); } .side { display:none; } .menu-btn { display:inline-grid; }
  .appbar { padding-inline:8px; gap:4px; } .appbar .ctx { display:none; }
  .page { padding:4px 16px 24px; }
  .h4 { font-size:26px; }
  .lms-inbox { grid-template-columns:minmax(0,1fr); block-size:auto; min-block-size:0; overflow:visible; }
  .lms-inbox.show-thread .lms-inbox-list, .lms-inbox:not(.show-thread) .lms-thread { display:none; }
  .lms-inbox-list { border:0; }
  .lms-thread-body { min-block-size:420px; padding:12px; }
  .lms-msg { max-inline-size:88%; }
  .mobile-only { display:inline-grid; }
  .grid2 { grid-template-columns:1fr; }
  .alert:has(> .btn) { flex-wrap:wrap; } .alert > .btn { margin-inline-start:30px; }
  .dialog-wrap { padding:0; place-items:stretch; } .dialog { border-radius:0; min-block-size:100vh; }
  .lms-notif-pop { position:static; inline-size:auto; }
  .lms-mod { grid-template-columns:1fr; }
  .lms-stats { grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px; }
  .lms-stat { flex-direction:column-reverse; padding:12px 14px; } .lms-stat-value { font-size:22px; }

  return shell('notif', header(S.prTitle, S.prSub) +
    (qs.get('push') === 'denied'
      ? `<div class="alert alert-warning" style="margin-block-end:16px">${I('notifications_off')}<span class="t" style="flex:1">${S.pushDenied}<div class="help">${S.pushDeniedH}</div></span></div>`
      : `<div class="alert alert-warning" style="margin-block-end:16px;align-items:center">${I('notifications_off')}<span class="t" style="flex:1">${S.pushOff}<div class="help">${S.pushHelp}</div></span><button class="btn btn-outlined btn-sm">${S.pushOn}</button></div>`) + `
    <div class="card"><table class="lms-prefs stack lms-prefs-m"><thead><tr><th></th><th>${ch('notifications',S.chIn,S.chInS)}</th><th>${ch('mail',S.chEmail,S.chEmailS)}</th><th>${ch('sms',S.chSms,S.chSmsS)}</th><th>${ch('phone_iphone',S.chPush,S.chPushS)}</th></tr></thead><tbody>
    ${row(S.evMsg,1,1,0,1)}${row(S.evMsgGrp,1,0,0,0)}${row(S.evAnn,1,1,0,1)}${row(S.evAnnPin,1,1,1,1,true)}${row(S.evGrade,1,1,0,1)}${row(S.evAbs,1,1,1,1,true)}${row(S.evMod,1,1,0,0)}</tbody></table>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 20px;border-block-start:1px solid var(--mud-palette-lines-default)"><span class="help">${I('lock','ms-sm')} ${S.lockedNote}</span><button class="btn btn-filled">${S.save}</button></div></div>`);
}
function moderation() {
  const st = (l, v, i) => `<div class="card lms-stat"><div><div class="lms-stat-label">${l}</div><div class="lms-stat-value">${v}</div></div><span class="sec-icon">${I(i)}</span></div>`;
  const r = (k, chip, sel) => `<tr ${sel?'class="sel"':''}><td data-label="${S.colMsg}" style="max-inline-size:280px"><span style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${S['r'+k]}</span></td><td data-label="${S.colReason}">${S['r'+k+'r']}</td><td data-label="${S.colBy}">${S['r'+k+'b']}</td><td data-label="${S.colWhen}"><span class="ltr">${S['r'+k+'w']}</span></td><td data-label="${S.colStatus}">${chip}</td></tr>`;
  const opt = (sel, t, h, err) => `<label class="toggle-row" style="align-items:flex-start;${sel?'outline:2px solid var(--mud-palette-primary);':''}"><span class="ms" style="color:${sel?'var(--mud-palette-primary)':'var(--mud-palette-action-default)'}">${sel?'radio_button_checked':'radio_button_unchecked'}</span><span class="t"><b ${err?'style="color:var(--mud-palette-error)"':''}>${t}</b><span class="help">${h}</span></span></label>`;
  const detail = `<aside class="card" aria-labelledby="dd"><div class="card-head"><span class="sec-icon">${I('flag')}</span><div style="flex:1"><h2 class="h6" id="dd">${S.detail}</h2><div class="caption muted">${S.convIn}</div></div></div>
    <div class="card-body" style="display:flex;flex-direction:column;gap:16px">
      <div class="lms-context" style="display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:var(--lms-radius-control);background:var(--mud-palette-background)" aria-label="${S.context}">
        ${msg('them', S.dm1, '<span class="ltr">10:31</span>', S.from1)}<div class="lms-flagged">${msg('them', S.dm2, `<span class="ltr">10:38</span> · <span class="chip chip-warning" style="height:22px">${I('flag')}${S.flagged}</span>`, S.from2)}</div>${msg('them', S.dm3, '<span class="ltr">10:40</span>', S.from3)}</div>
      <div><div class="label">${S.reasonL}</div><p>${S.r1r} · ${S.reasonT}</p></div>
      <div><div class="label">${S.sender}</div><p class="muted">${S.senderV}</p></div>
      <fieldset style="border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px"><legend class="label" style="margin-block-end:6px">${S.decide}</legend>${opt(0,S.dDismiss,S.dDismissH)}${opt(0,S.dHide,S.dHideH)}${opt(1,S.dRestrict,S.dRestrictH,1)}
        <div class="grid2" style="padding-inline-start:44px"><div class="field"><span class="label">${S.forL}</span><div class="input"><span>${S.days7}</span><span class="ph-text"></span>${I('arrow_drop_down')}</div><span class="help ltr">${S.untilL}</span></div></div>
        ${opt(0,S.dLock,S.dLockH,1)}</fieldset>
      <div class="field"><span class="label">${S.note}</span><div class="input" style="min-height:64px"></div></div>
      <div style="display:flex;justify-content:flex-end"><button class="btn btn-filled">${S.decideBtn}</button></div></div></aside>`;
  return shell('mod', header(S.modTitle, S.modSub) +
    `<div class="lms-stats">${st(S.stOpen,'3','flag')}${st(S.stToday,'2','today')}${st(S.stBlocked,'1','block')}${st(S.stAvg,'4 h','timer')}</div>
    <div class="lms-mod"><div class="card"><div style="padding:12px 16px;border-block-end:1px solid var(--mud-palette-lines-default)"><div style="display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center"><div class="seg"><span aria-selected="true">${S.stOpen}</span><span>${S.sDone}</span></div><span class="chip chip-error">${I('timer')}${S.sla}</span></div></div>
      <table class="stack"><thead><tr><th>${S.colMsg}</th><th>${S.colReason}</th><th>${S.colBy}</th><th>${S.colWhen}</th><th>${S.colStatus}</th></tr></thead><tbody>
      ${r(1,`<span class="chip chip-warning chip-dot">${S.sReview}</span>`,1)}${r(2,`<span class="chip chip-info chip-dot">${S.sNew}</span>`)}${r(3,`<span class="chip chip-error chip-dot">${S.sNew}</span>`)}${r(4,`<span class="chip chip-info chip-dot">${S.sNew}</span>`)}</tbody></table></div>${detail}</div>`);
}

function composerStates() {
  const st = (label, html, action='') => `<div class="card" style="overflow:hidden"><div class="caption muted" style="padding:10px 16px;font-weight:600">${label}</div><div class="lms-composer-off" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">${html}${action}</div></div>`;
  const al = (t, icon='info', cls='alert-info') => `<div class="alert ${cls}" style="flex:1;min-inline-size:220px">${I(icon)}<span class="t">${t}</span></div>`;
  return shell('inbox', header(S.csTitle, S.inboxSub) + `<div style="display:flex;flex-direction:column;gap:16px;max-inline-size:860px">
    ${st(S.csBlockerL, al(S.csBlocker,'block'), `<button class="btn btn-outlined">${S.unblock}</button>`)}
    ${st(S.csBlockedL, al(S.csBlocked))}
    ${st(S.csRulesL, al(S.off))}
    ${st(S.csRestrictedL, al(S.csRestricted,'schedule','alert-warning'))}
    ${st(S.csDisabledL, al(S.csDisabled,'toggle_off'))}
    ${st(S.csRateL, `<div class="lms-composer" style="flex:1;padding:0;border:0"><div class="input"><span>${S.gm3}</span></div><button class="btn" disabled>${I('send','flip')}${S.send}</button></div><div class="help" role="status" style="inline-size:100%;color:var(--mud-palette-warning)">${I('hourglass_top','ms-sm')} ${S.csRate}</div>`)}
  </div>`);
}
function rules() {
  const roles = ['roAdmin','roMgr','roSup','roCou','roTch','roStu','roGua'];
  const v = { roAdmin:'AAAAAAA', roMgr:'AAAAAAA', roSup:'UUUUUUU', roCou:'UUUUUUU', roTch:'UUUURRR', roStu:'NNNURNN', roGua:'NNNURNN' };
  const cell = (c, to) => { const t = {A:S.vAny, U:S.vUnit, R:S.vRel, N:S.vNo}[c]; const cls = c==='N' ? '' : c==='A' ? 'chip-success' : 'chip-info';
    return `<td data-label="${S[to]}"><span class="chip ${cls}">${t}${I('arrow_drop_down')}</span></td>`; };
  return shell('rules', header(S.rlTitle, S.rlSub, `<button class="btn btn-filled">${S.rlSave}</button>`) +
    `<div class="alert alert-info" style="margin-block-end:16px">${I('info')}<span class="t">${S.rlNote}</span></div>
    <div class="card" style="overflow-x:auto"><table class="stack"><thead><tr><th>${S.rlFrom} → ${S.to}</th>${roles.map(r => `<th>${S[r]}</th>`).join('')}</tr></thead><tbody>
    ${roles.map(r => `<tr><td data-label="${S.rlFrom}" style="font-weight:600">${S[r]}</td>${[...v[r]].map((c,i) => cell(c, roles[i])).join('')}</tr>`).join('')}</tbody></table></div>`);
}
document.getElementById('app').innerHTML = ({inbox, thread, compose, announcements, 'announce-compose':announceCompose, notifications, prefs, moderation, 'composer-states':composerStates, rules}[screen] || inbox)();
</script>
</body>
</html>
