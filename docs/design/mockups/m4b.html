<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LMS M4b mockups</title>
<!-- Design reference only (Task 12 of the M4b plan). Not served by the app. Open with ?screen=live-list&lang=ar&theme=dark -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<style>
/* ---------- MudBlazor palette variables as the LMS theme sets them (LmsTheme.cs; LinesInputs from #446) ---------- */
:root {
  --mud-palette-primary:#00663D; --mud-palette-primary-text:#FFFFFF; --mud-palette-info:#1F5FA6; --mud-palette-success:#1D7344;
  --mud-palette-warning:#9A5B00; --mud-palette-error:#B42318; --mud-palette-background:#F4F6F7; --mud-palette-background-gray:#ECEFF1;
  --mud-palette-surface:#FFFFFF; --mud-palette-text-primary:#17212B; --mud-palette-text-secondary:#526070; --mud-palette-text-disabled:rgba(23,33,43,.42);
  --mud-palette-action-default:#526070; --mud-palette-action-disabled:rgba(23,33,43,.32); --mud-palette-action-disabled-background:rgba(23,33,43,.08);
  --mud-palette-lines-default:#E1E6EA; --mud-palette-lines-inputs:#7A8793; --mud-palette-table-lines:#E7EBEE; --mud-palette-overlay-dark:rgba(13,24,30,.5);
  --lms-radius-control:8px; --lms-radius-surface:12px;
}
:root[data-theme=dark] {
  --mud-palette-primary:#4CC38A; --mud-palette-primary-text:#032013; --mud-palette-info:#77AEEA; --mud-palette-success:#62C08B;
  --mud-palette-warning:#E5A647; --mud-palette-error:#F2786D; --mud-palette-background:#0F1518; --mud-palette-background-gray:#151D21;
  --mud-palette-surface:#162024; --mud-palette-text-primary:#E5ECEE; --mud-palette-text-secondary:#9DACB5; --mud-palette-text-disabled:rgba(229,236,238,.4);
  --mud-palette-action-default:#9DACB5; --mud-palette-action-disabled:rgba(229,236,238,.3); --mud-palette-action-disabled-background:rgba(229,236,238,.1);
  --mud-palette-lines-default:#28343A; --mud-palette-lines-inputs:#6A7B85; --mud-palette-table-lines:#243035; --mud-palette-overlay-dark:rgba(0,0,0,.6);
}
* { box-sizing:border-box; }
html { font-size:16px; }
body { margin:0; background:var(--mud-palette-background); color:var(--mud-palette-text-primary); font-family:Inter, Cairo, system-ui, sans-serif; font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased; }
:root[lang=ar] body { font-family:Cairo, Inter, system-ui, sans-serif; }
.ms { font-family:'Material Symbols Rounded'; font-weight:normal; font-style:normal; font-size:20px; line-height:1; display:inline-block; vertical-align:middle; -webkit-font-feature-settings:'liga'; user-select:none; }
.ms-sm { font-size:18px; } .ms-lg { font-size:40px; }
[dir=rtl] .flip { transform:scaleX(-1); }
h1,h2,h3 { margin:0; font-weight:600; }
.h4 { font-size:26px; line-height:1.3; } .h6 { font-size:17px; line-height:1.4; } .sub1 { font-size:16px; font-weight:500; } .body2 { font-size:14px; } .caption { font-size:12px; }

/* ---------- shell (simplified: app bar + content column; the real sidebar is unchanged) ---------- */
.appbar { height:56px; display:flex; align-items:center; gap:12px; padding-inline:24px; background:var(--mud-palette-surface); border-bottom:1px solid var(--mud-palette-lines-default); }
.brand { display:flex; align-items:center; gap:8px; font-weight:700; color:var(--mud-palette-primary); }
.brand-mark { width:28px; height:28px; border-radius:8px; background:var(--mud-palette-primary); color:var(--mud-palette-primary-text); display:grid; place-items:center; font-size:15px; }
.appbar .spacer { flex:1; }
.page { padding:24px; max-width:1180px; margin-inline:auto; }
.board { display:grid; grid-template-columns:repeat(auto-fill, minmax(340px, 1fr)); gap:20px; align-items:start; }
.board-wide { grid-template-columns:repeat(auto-fill, minmax(520px, 1fr)); }
.board > * { min-width:0; }
.state-label { font-size:12px; font-weight:600; letter-spacing:.02em; color:var(--mud-palette-text-secondary); margin-block-end:6px; display:flex; gap:6px; align-items:center; }
.state-label code { font-family:ui-monospace, monospace; font-size:11px; background:var(--mud-palette-background-gray); padding:1px 6px; border-radius:4px; }

/* ---------- existing LMS building blocks (as in lms-theme.css) ---------- */
.lms-muted { color:var(--mud-palette-text-secondary); }
.lms-cell-strong { font-weight:500; }
.lms-page-header { display:flex; flex-wrap:wrap; align-items:center; gap:16px 20px; margin-bottom:24px; }
.lms-page-header-text { flex:1 1 200px; min-width:0; }
.lms-page-subtitle { color:var(--mud-palette-text-secondary); margin-top:4px; font-size:14px; }
.lms-section { background:var(--mud-palette-surface); border:1px solid var(--mud-palette-lines-default); border-radius:var(--lms-radius-surface); }
.lms-section + .lms-section { margin-top:20px; }
.lms-section-head { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 20px; border-bottom:1px solid var(--mud-palette-lines-default); }
.lms-section-body { padding:16px 20px 20px; }
.lms-section-flush > .lms-section-body { padding:0; }
.lms-filters { display:flex; flex-wrap:wrap; gap:12px 16px; align-items:center; padding:12px 20px; border-bottom:1px solid var(--mud-palette-lines-default); }
.tabs { display:flex; gap:4px; margin-bottom:20px; border-bottom:1px solid var(--mud-palette-lines-default); overflow-x:auto; }
.tab { padding:10px 14px; font-size:14px; font-weight:500; color:var(--mud-palette-text-secondary); border-bottom:2px solid transparent; white-space:nowrap; }
.tab[aria-current] { color:var(--mud-palette-primary); border-color:var(--mud-palette-primary); }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; height:36px; padding-inline:16px; border-radius:var(--lms-radius-control); font:inherit; font-size:14px; font-weight:500; border:1px solid transparent; background:transparent; color:var(--mud-palette-primary); cursor:pointer; white-space:nowrap; }
.btn-filled { background:var(--mud-palette-primary); color:var(--mud-palette-primary-text); }
.btn-outlined { border-color:var(--mud-palette-lines-inputs); }
.btn-error { color:var(--mud-palette-error); }
.btn-filled.btn-error { background:var(--mud-palette-error); color:#fff; }
:root[data-theme=dark] .btn-filled.btn-error { color:#2A0603; }
.btn-text-default { color:var(--mud-palette-text-primary); }
.btn[disabled] { background:var(--mud-palette-action-disabled-background); color:var(--mud-palette-action-disabled); border-color:transparent; cursor:default; }
.btn-sm { height:30px; padding-inline:10px; font-size:13px; }
.icon-btn { width:34px; height:34px; border-radius:50%; display:inline-grid; place-items:center; color:var(--mud-palette-action-default); }
.icon-btn.err { color:var(--mud-palette-error); }
.chip { display:inline-flex; align-items:center; gap:4px; height:24px; padding-inline:8px; border-radius:12px; font-size:12.5px; font-weight:500; white-space:nowrap; }
.chip .ms { font-size:15px; }
.chip-info { color:var(--mud-palette-info); background:color-mix(in srgb, var(--mud-palette-info) 12%, transparent); }
.chip-success { color:var(--mud-palette-success); background:color-mix(in srgb, var(--mud-palette-success) 12%, transparent); }
.chip-warning { color:var(--mud-palette-warning); background:color-mix(in srgb, var(--mud-palette-warning) 14%, transparent); }
.chip-error { color:var(--mud-palette-error); background:color-mix(in srgb, var(--mud-palette-error) 12%, transparent); }
.chip-default { color:var(--mud-palette-text-primary); background:var(--mud-palette-background-gray); }
.alert { display:flex; gap:12px; align-items:flex-start; padding:10px 14px; border:1px solid; border-radius:var(--lms-radius-control); font-size:14px; }
.alert .ms { margin-top:1px; }
.alert-info { border-color:var(--mud-palette-info); color:var(--mud-palette-info); } .alert-info .alert-text { color:var(--mud-palette-text-primary); }
.alert-warning { border-color:var(--mud-palette-warning); color:var(--mud-palette-warning); } .alert-warning .alert-text { color:var(--mud-palette-text-primary); }
.alert-error { border-color:var(--mud-palette-error); color:var(--mud-palette-error); } .alert-error .alert-text { color:var(--mud-palette-text-primary); }
.alert-title { font-weight:600; display:block; }
table.t { width:100%; border-collapse:collapse; font-size:14px; }
table.t th { text-align:start; font-size:12.5px; font-weight:600; color:var(--mud-palette-text-secondary); padding:10px 12px; border-bottom:1px solid var(--mud-palette-table-lines); background:var(--mud-palette-background-gray); }
table.t td { padding:10px 12px; border-bottom:1px solid var(--mud-palette-table-lines); vertical-align:top; }
table.t tr > :first-child { padding-inline-start:20px; } table.t tr > :last-child { padding-inline-end:20px; }
table.t tr:last-child td { border-bottom:0; }
.lms-row-actions { display:inline-flex; align-items:center; gap:2px; justify-content:flex-end; }
.lms-row-actions-sep { width:1px; height:20px; margin-inline:4px; background:var(--mud-palette-lines-default); }
.toggle-group { display:inline-flex; border:1px solid var(--mud-palette-lines-inputs); border-radius:var(--lms-radius-control); overflow:hidden; }
.toggle-group span { padding:6px 14px; font-size:13.5px; font-weight:500; color:var(--mud-palette-text-secondary); }
.toggle-group span[aria-pressed=true] { background:color-mix(in srgb, var(--mud-palette-primary) 12%, transparent); color:var(--mud-palette-primary); }
.toggle-group span + span { border-inline-start:1px solid var(--mud-palette-lines-inputs); }
.field { position:relative; border:1px solid var(--mud-palette-lines-inputs); border-radius:var(--lms-radius-control); padding:16px 12px 6px; min-height:48px; background:var(--mud-palette-surface); font-size:14.5px; overflow-wrap:anywhere; padding-inline-end:40px; }
.field label { position:absolute; top:4px; inset-inline-start:12px; font-size:11.5px; color:var(--mud-palette-text-secondary); }
.field .ms { position:absolute; inset-inline-end:10px; top:13px; color:var(--mud-palette-action-default); }
.field.err { border-color:var(--mud-palette-error); } .field.err label { color:var(--mud-palette-error); }
.helper { font-size:12px; color:var(--mud-palette-text-secondary); margin:4px 12px 0; } .helper.err { color:var(--mud-palette-error); }
.vstack { display:flex; flex-direction:column; gap:14px; }
.row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.lms-fieldset { border:0; margin:0; padding:0; min-width:0; }
.lms-fieldset + .lms-fieldset { margin-top:20px; padding-top:16px; border-top:1px solid var(--mud-palette-lines-default); }
.lms-fieldset legend { font-size:13px; font-weight:600; color:var(--mud-palette-text-secondary); margin-bottom:10px; padding:0; }
.lms-form-grid { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px 16px; }
.lms-form-grid.two { grid-template-columns:repeat(2, minmax(0,1fr)); }
.radio { display:inline-flex; align-items:center; gap:8px; font-size:14px; margin-inline-end:20px; }
.radio i { width:18px; height:18px; border-radius:50%; border:2px solid var(--mud-palette-lines-inputs); display:inline-block; }
.radio i.on { border-color:var(--mud-palette-primary); box-shadow:inset 0 0 0 3px var(--mud-palette-surface); background:var(--mud-palette-primary); }
.dialog { background:var(--mud-palette-surface); border-radius:var(--lms-radius-surface); box-shadow:0 12px 32px rgba(13,24,30,.18), 0 2px 6px rgba(13,24,30,.08); border:1px solid var(--mud-palette-lines-default); overflow:hidden; }
.dialog-title { padding:18px 24px 6px; font-size:18px; font-weight:600; display:flex; justify-content:space-between; align-items:center; }
.dialog-content { padding:12px 24px 16px; }
.lms-dialog-actions { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:8px; padding:8px 16px 14px; }
.lms-dialog-actions .start { margin-inline-end:auto; }
.lms-details { margin:0; display:grid; }
.lms-detail { display:grid; grid-template-columns:minmax(0,2fr) minmax(0,3fr); gap:4px 16px; padding-block:8px; }
.lms-detail + .lms-detail { border-top:1px solid var(--mud-palette-table-lines); }
.lms-detail dt { color:var(--mud-palette-text-secondary); font-size:13px; } .lms-detail dd { margin:0; font-weight:500; overflow-wrap:anywhere; }
.progress { height:4px; border-radius:2px; background:color-mix(in srgb, var(--mud-palette-primary) 18%, transparent); overflow:hidden; }
.progress b { display:block; height:100%; background:var(--mud-palette-primary); }
.progress.indet b { width:35%; margin-inline-start:30%; }
.spinner { width:16px; height:16px; border-radius:50%; border:2px solid color-mix(in srgb, currentColor 25%, transparent); border-top-color:currentColor; display:inline-block; }
.visually-hidden { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

/* ======================================================================================
   lms-theme additions for M4b (spec §6). Logical properties and palette variables only.
   ====================================================================================== */
.lms-live-dot { width:8px; height:8px; border-radius:50%; background:currentColor; animation:lms-live-pulse 2s ease-in-out infinite; }
@keyframes lms-live-pulse { 0%,100% { opacity:1; } 50% { opacity:.35; } }
@media (prefers-reduced-motion: reduce) { .lms-live-dot { animation:none; } }
.lms-when { display:flex; flex-direction:column; direction:ltr; text-align:start; white-space:nowrap; }
[dir=rtl] .lms-when { text-align:end; }
.lms-when .lms-when-time { color:var(--mud-palette-text-secondary); font-size:13px; }
.lms-host-hint { display:inline-flex; align-items:center; gap:4px; direction:ltr; padding:1px 6px; border-radius:4px; background:var(--mud-palette-background-gray); color:var(--mud-palette-text-secondary); font-size:12px; font-weight:500; }
.lms-recurrence-preview { margin-top:12px; padding:12px 16px; border-radius:var(--lms-radius-control); background:var(--mud-palette-background-gray); }
.lms-recurrence-preview ul { list-style:none; margin:8px 0 0; padding:0; display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:4px 24px; font-size:13.5px; direction:ltr; }
[dir=rtl] .lms-recurrence-preview ul { text-align:end; }
.lms-recurrence-preview .count { font-weight:600; }
.lms-day-toggles { display:flex; flex-wrap:wrap; gap:6px; }
.lms-day-toggles span { min-width:44px; height:32px; padding-inline:8px; display:inline-grid; place-items:center; border-radius:16px; border:1px solid var(--mud-palette-lines-inputs); font-size:13px; font-weight:500; }
.lms-day-toggles span[aria-pressed=true] { background:var(--mud-palette-primary); border-color:var(--mud-palette-primary); color:var(--mud-palette-primary-text); }
.lms-choice { display:flex; gap:12px; align-items:flex-start; padding:12px 14px; border:1px solid var(--mud-palette-lines-default); border-radius:var(--lms-radius-control); }
.lms-choice + .lms-choice { margin-top:8px; }
.lms-choice.on { border-color:var(--mud-palette-primary); background:color-mix(in srgb, var(--mud-palette-primary) 6%, transparent); }
.lms-choice .radio { margin:2px 0 0; }
.lms-kind-tile { flex:none; width:40px; height:40px; border-radius:10px; display:grid; place-items:center; color:var(--mud-palette-primary); background:color-mix(in srgb, var(--mud-palette-primary) 12%, transparent); }
.lms-join-panel { margin-top:16px; padding:16px; border-radius:var(--lms-radius-control); background:var(--mud-palette-background-gray); display:flex; flex-direction:column; gap:10px; align-items:flex-start; }
.lms-join-panel .h6 { font-weight:600; }
.lms-date-block { flex:none; width:44px; height:44px; border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.05; color:var(--mud-palette-primary); background:color-mix(in srgb, var(--mud-palette-primary) 12%, transparent); }
.lms-date-block b { font-size:17px; } .lms-date-block small { font-size:11px; font-weight:600; }
.lms-steps { list-style:none; margin:0 0 18px; padding:0; display:flex; align-items:center; gap:8px; }
.lms-steps li { display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--mud-palette-text-secondary); }
.lms-steps li + li::before { content:""; width:28px; height:1px; background:var(--mud-palette-lines-inputs); margin-inline-end:0; }
.lms-steps .n { width:24px; height:24px; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:600; border:1px solid var(--mud-palette-lines-inputs); }
.lms-steps .done .n { background:var(--mud-palette-primary); border-color:var(--mud-palette-primary); color:var(--mud-palette-primary-text); }
.lms-steps .cur { color:var(--mud-palette-text-primary); font-weight:600; }
.lms-steps .cur .n { border:2px solid var(--mud-palette-primary); color:var(--mud-palette-primary); }
.lms-steps .fail .n { background:var(--mud-palette-error); border-color:var(--mud-palette-error); color:var(--mud-palette-surface); }
.lms-steps .fail { color:var(--mud-palette-error); font-weight:600; }
.lms-dropzone { border:1px dashed var(--mud-palette-lines-inputs); border-radius:var(--lms-radius-surface); padding:24px; display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; }
.lms-dropzone .ms-lg { color:var(--mud-palette-text-secondary); }
.lms-file-row { display:flex; align-items:center; gap:12px; padding:12px 14px; border:1px solid var(--mud-palette-lines-default); border-radius:var(--lms-radius-control); }
.lms-file-row .grow { flex:1; min-width:0; }
.lms-file-row .name { direction:ltr; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500; font-size:14px; }
[dir=rtl] .lms-file-row .name { text-align:end; }
.lms-player { border:1px solid var(--mud-palette-lines-default); border-radius:var(--lms-radius-surface); overflow:hidden; background:var(--mud-palette-surface); position:relative; }
.lms-preview-strip { display:flex; align-items:center; gap:8px; padding:8px 16px; font-size:13.5px; font-weight:500; color:var(--mud-palette-info); background:color-mix(in srgb, var(--mud-palette-info) 12%, transparent); }
.lms-player-bar { height:48px; display:flex; align-items:center; gap:12px; padding-inline:16px 8px; border-bottom:1px solid var(--mud-palette-lines-default); }
.lms-player-bar .title { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500; font-size:14px; }
.lms-save-state { display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--mud-palette-text-secondary); white-space:nowrap; }
.lms-save-state.failed { color:var(--mud-palette-error); }
.lms-player-frame { display:block; width:100%; min-height:70vh; border:0; background:#FFFFFF; }
.lms-player-overlay { position:absolute; inset:48px 0 0 0; display:grid; place-items:center; padding:24px; background:color-mix(in srgb, var(--mud-palette-surface) 94%, transparent); text-align:center; }
.lms-player-msg { display:flex; align-items:center; gap:8px; padding-block:6px; padding-inline:16px 8px; font-size:14px; color:var(--mud-palette-error); background:color-mix(in srgb, var(--mud-palette-error) 12%, transparent); border-bottom:1px solid var(--mud-palette-lines-default); }
.lms-player-msg .grow { flex:1; min-width:0; }
.lms-player-overlay > div { max-width:44ch; display:flex; flex-direction:column; align-items:center; gap:12px; }

/* fake package content inside the white frame (packages bring their own light styling) */
.pkg { min-height:inherit; padding:40px; color:#1d2b36; font-family:Arial, sans-serif; background:#fff; }
.pkg h3 { font-size:22px; margin-bottom:12px; color:#0b4f7c; } .pkg p { max-width:56ch; }
.pkg .q { margin-top:20px; display:grid; gap:10px; max-width:420px; } .pkg .q div { border:1px solid #c9d3db; border-radius:6px; padding:10px 12px; }
.pkg .nav { margin-top:28px; display:flex; gap:10px; } .pkg .nav span { background:#0b4f7c; color:#fff; padding:8px 16px; border-radius:4px; }

/* ---------- phone (360 px) ---------- */
@media (max-width:599px) {
  .page { padding:16px; }
  .appbar { padding-inline:16px; }
  .board, .board-wide { grid-template-columns:1fr; }
  .lms-form-grid, .lms-form-grid.two { grid-template-columns:1fr; }
  .lms-recurrence-preview ul { grid-template-columns:1fr; }
  .h4 { font-size:22px; }
  .lms-page-header .btn-filled { width:100%; }
  .lms-filters { padding:12px 16px; }
  table.t.stack thead { display:none; }
  table.t.stack, table.t.stack tbody, table.t.stack tr, table.t.stack td { display:block; width:100%; }
  table.t.stack tr { padding:12px 16px; border-bottom:1px solid var(--mud-palette-table-lines); }
  table.t.stack td { border:0; padding:3px 0 !important; display:grid; grid-template-columns:96px minmax(0,1fr); gap:8px; }
  table.t.stack td > * { justify-self:start; min-width:0; }
  .appbar .body2 { display:none; }
  table.t.stack td::before { content:attr(data-label); font-size:12.5px; color:var(--mud-palette-text-secondary); }
  table.t.stack td.actions { grid-template-columns:1fr; padding-top:6px !important; } table.t.stack td.actions::before { display:none; }
  .lms-steps .lbl { display:none; } .lms-steps .cur .lbl, .lms-steps .fail .lbl { display:inline; white-space:nowrap; }
  .lms-player-bar { flex-wrap:nowrap; gap:4px; }
  .lms-save-state { min-width:0; font-size:12px; }
