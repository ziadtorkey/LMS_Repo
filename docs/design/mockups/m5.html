<style>
/* ---------- Stitch tokens as LmsTheme.cs and lms-stitch.css set them (main after #560) ---------- */
:root {
  --mud-palette-primary:#00663D; --mud-palette-primary-text:#FFFFFF; --mud-palette-info:#1E40AF; --mud-palette-success:#1D7344;
  --mud-palette-warning:#B45309; --mud-palette-error:#B42318; --mud-palette-background:#F8FAFC; --mud-palette-background-gray:#F1F5F9;
  --mud-palette-surface:#FFFFFF; --mud-palette-text-primary:#0B1C30; --mud-palette-text-secondary:#475569;
  --mud-palette-action-default:#475569; --mud-palette-action-disabled:rgba(11,28,48,.32); --mud-palette-action-disabled-background:rgba(11,28,48,.08);
  --mud-palette-lines-default:#E2E8F0; --mud-palette-lines-inputs:#7A8793; --mud-palette-table-lines:#F1F5F9; --mud-palette-overlay-dark:rgba(11,28,48,.45);
  --lms-accent:#10B981; --lms-recessed:#EFF4FF; --lms-radius-control:8px; --lms-radius-surface:12px;
  --lms-shadow-1:0 1px 3px 0 rgba(0,0,0,.04), 0 1px 2px -1px rgba(0,0,0,.02); --lms-shadow-2:0 10px 25px -5px rgba(0,0,0,.08), 0 8px 10px -6px rgba(0,0,0,.04);
  --lms-focus-ring:0 0 0 2px var(--mud-palette-surface), 0 0 0 4px var(--mud-palette-primary);
}
:root[data-theme=dark] {
  --mud-palette-primary:#4CC38A; --mud-palette-primary-text:#032013; --mud-palette-info:#60A5FA; --mud-palette-success:#34D399;
  --mud-palette-warning:#FBBF24; --mud-palette-error:#F87171; --mud-palette-background:#090D10; --mud-palette-background-gray:#16202A;
  --mud-palette-surface:#121A20; --mud-palette-text-primary:#E2E8F0; --mud-palette-text-secondary:#94A3B8;
  --mud-palette-action-default:#94A3B8; --mud-palette-action-disabled:rgba(226,232,240,.3); --mud-palette-action-disabled-background:rgba(226,232,240,.1);
  --mud-palette-lines-default:#1E293B; --mud-palette-lines-inputs:#6A7B85; --mud-palette-table-lines:#1E293B; --mud-palette-overlay-dark:rgba(0,0,0,.6);
  --lms-recessed:#16202A; --lms-shadow-1:0 1px 3px 0 rgba(0,0,0,.35), 0 1px 2px -1px rgba(0,0,0,.25); --lms-shadow-2:0 10px 25px -5px rgba(0,0,0,.55), 0 8px 10px -6px rgba(0,0,0,.35);
}
* { box-sizing:border-box; }
body { margin:0; background:var(--mud-palette-background); color:var(--mud-palette-text-primary); font-family:Inter, Cairo, system-ui, sans-serif; font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased; }
:root[lang=ar] body { font-family:Cairo, Inter, system-ui, sans-serif; }
.ms { font-family:'Material Symbols Rounded'; font-weight:normal; font-style:normal; font-size:20px; line-height:1; display:inline-block; vertical-align:middle; user-select:none; }
.ms-sm { font-size:18px; }
[dir=rtl] .flip { transform:scaleX(-1); }
h1,h2,h3,p { margin:0; }
.ltr { direction:ltr; unicode-bidi:isolate; }
.muted { color:var(--mud-palette-text-secondary); }
.caption { font-size:12.5px; }
.vh { position:absolute; inline-size:1px; block-size:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }

/* ---------- shell: sidebar (Stitch groups), glass app bar ---------- */
.shell { display:grid; grid-template-columns:260px minmax(0,1fr); min-height:100vh; }
.side { background:var(--mud-palette-surface); border-inline-end:1px solid var(--mud-palette-lines-default); padding:20px 12px; }
.brand { display:flex; align-items:center; gap:10px; padding:0 8px 16px; font-weight:700; }
.brand-mark { inline-size:36px; block-size:36px; border-radius:10px; background:var(--mud-palette-primary); color:var(--mud-palette-primary-text); display:grid; place-items:center; }
.nav-sec { font-size:12px; font-weight:600; color:var(--mud-palette-text-secondary); padding:14px 12px 4px; }
.nav { display:flex; align-items:center; gap:12px; padding:9px 12px; border-radius:var(--lms-radius-control); font-size:14px; }
.nav[aria-current] { background:var(--mud-palette-primary); color:var(--mud-palette-primary-text); font-weight:600; }
.nav .badge { margin-inline-start:auto; }
.appbar { height:64px; display:flex; align-items:center; gap:12px; padding-inline:24px; }
.appbar .spacer { flex:1; }
.pill { display:inline-flex; align-items:center; gap:6px; height:36px; padding-inline:12px; border-radius:999px; background:var(--lms-recessed); font-size:13.5px; font-weight:500; }
.page { padding:8px 32px 32px; }
.icon-btn { inline-size:40px; block-size:40px; border-radius:50%; display:inline-grid; place-items:center; color:var(--mud-palette-action-default); position:relative; border:0; background:none; }
.icon-btn.sm { inline-size:32px; block-size:32px; }
.badge { min-inline-size:18px; height:18px; padding-inline:5px; border-radius:9px; background:var(--mud-palette-error); color:#fff; font-size:11px; font-weight:700; display:inline-grid; place-items:center; }
:root[data-theme=dark] .badge { color:#2A0603; }
.icon-btn .badge { position:absolute; inset-block-start:2px; inset-inline-end:0; }
.menu-btn { display:none; }

/* ---------- Stitch building blocks (lms-stitch.css) ---------- */
.ph { display:flex; flex-wrap:wrap; align-items:flex-end; gap:12px 20px; margin-block:8px 24px; }
.ph-text { flex:1 1 260px; min-inline-size:0; }
.h4 { font-family:Cairo, Inter, sans-serif; font-size:32px; font-weight:700; line-height:1.25; letter-spacing:-.01em; }
.h6 { font-family:Cairo, Inter, sans-serif; font-size:18px; font-weight:600; line-height:1.4; }
.sub { color:var(--mud-palette-text-secondary); font-size:14.5px; margin-block-start:4px; }
.card { background:var(--mud-palette-surface); border:1px solid var(--mud-palette-lines-default); border-radius:var(--lms-radius-surface); box-shadow:var(--lms-shadow-1); }
.card-head { display:flex; align-items:center; gap:12px; padding:16px 20px; border-block-end:1px solid var(--mud-palette-lines-default); }
.card-body { padding:16px 20px 20px; }
.sec-icon { inline-size:40px; block-size:40px; border-radius:10px; display:grid; place-items:center; flex:none; color:var(--mud-palette-primary); background:color-mix(in srgb, var(--mud-palette-primary) 10%, transparent); }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; height:40px; padding-inline:16px; border-radius:var(--lms-radius-control); font:inherit; font-size:14px; font-weight:600; border:1px solid transparent; background:none; color:var(--mud-palette-primary); white-space:nowrap; }
.btn-filled { background:var(--mud-palette-primary); color:var(--mud-palette-primary-text); }
.btn-outlined { border-color:var(--mud-palette-lines-default); background:var(--mud-palette-surface); color:var(--mud-palette-text-primary); }
.btn-error { color:var(--mud-palette-error); }
.btn-sm { height:32px; padding-inline:12px; font-size:13px; }
.btn[disabled] { background:var(--mud-palette-action-disabled-background); color:var(--mud-palette-action-disabled); border-color:transparent; }
.focus { box-shadow:var(--lms-focus-ring); }
.field { display:flex; flex-direction:column; gap:6px; min-inline-size:0; }
.label { font-size:13px; font-weight:500; }
.input { min-height:40px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:6px 12px; border-radius:var(--lms-radius-control); background:var(--lms-recessed); border:1px solid var(--mud-palette-lines-inputs); font-size:14px; color:var(--mud-palette-text-primary); }
.input.focused { border-color:var(--mud-palette-primary); box-shadow:0 0 0 3px color-mix(in srgb, var(--mud-palette-primary) 25%, transparent); }
.input .ph-text { color:var(--mud-palette-text-secondary); flex:1; }
.help { font-size:12.5px; color:var(--mud-palette-text-secondary); }
.chip { display:inline-flex; align-items:center; gap:5px; height:26px; padding-inline:10px; border-radius:999px; font-size:12.5px; font-weight:500; white-space:nowrap; background:var(--mud-palette-background-gray); color:var(--mud-palette-text-primary); }
.chip .ms { font-size:16px; }
.chip-dot::before { content:''; inline-size:6px; block-size:6px; border-radius:50%; background:currentColor; }
.chip-success { color:var(--mud-palette-success); background:color-mix(in srgb, var(--mud-palette-success) 12%, transparent); }
.chip-info { color:var(--mud-palette-info); background:color-mix(in srgb, var(--mud-palette-info) 12%, transparent); }
.chip-warning { color:var(--mud-palette-warning); background:color-mix(in srgb, var(--mud-palette-warning) 14%, transparent); }
.chip-error { color:var(--mud-palette-error); background:color-mix(in srgb, var(--mud-palette-error) 12%, transparent); }
.chip-input { background:var(--mud-palette-surface); border:1px solid var(--mud-palette-lines-default); }
.seg { display:flex; inline-size:fit-content; max-inline-size:100%; overflow-x:auto; gap:4px; padding:4px; border-radius:10px; background:var(--lms-recessed); }
.seg span { white-space:nowrap; padding:6px 14px; border-radius:var(--lms-radius-control); font-size:13.5px; font-weight:500; color:var(--mud-palette-text-secondary); }
.seg span[aria-selected] { background:var(--mud-palette-surface); color:var(--mud-palette-text-primary); box-shadow:var(--lms-shadow-1); }
.toggle-row { display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:var(--lms-radius-control); background:var(--lms-recessed); }
.toggle-row + .toggle-row { margin-block-start:12px; }
.toggle-row .t { flex:1; min-inline-size:0; } .toggle-row .t b { font-weight:500; display:block; }
.switch { inline-size:36px; block-size:20px; border-radius:10px; background:var(--mud-palette-lines-inputs); position:relative; flex:none; }
.switch::after { content:''; position:absolute; inset-block-start:2px; inset-inline-start:2px; inline-size:16px; block-size:16px; border-radius:50%; background:#fff; }
.switch.on { background:var(--mud-palette-primary); } .switch.on::after { inset-inline-start:18px; }
:root[data-theme=dark] .switch.on::after { background:var(--mud-palette-primary-text); }
.switch.locked { opacity:.55; }
.avatar { inline-size:40px; block-size:40px; border-radius:50%; display:grid; place-items:center; flex:none; font-size:14px; font-weight:600; background:color-mix(in srgb, var(--mud-palette-primary) 14%, transparent); color:var(--mud-palette-primary); }
.avatar.sm { inline-size:32px; block-size:32px; font-size:12px; }
.avatar.grp { background:color-mix(in srgb, var(--mud-palette-info) 14%, transparent); color:var(--mud-palette-info); }
.dot { inline-size:8px; block-size:8px; border-radius:50%; background:var(--lms-accent); flex:none; }
table { inline-size:100%; border-collapse:collapse; font-size:14px; }
th, td { overflow-wrap:anywhere; }
th { text-align:start; font-size:13px; font-weight:600; color:var(--mud-palette-text-secondary); background:var(--mud-palette-background-gray); padding:12px 16px; }
td .ltr { white-space:nowrap; }
td { padding:12px 16px; border-block-start:1px solid var(--mud-palette-table-lines); vertical-align:middle; }
tr.sel td { background:color-mix(in srgb, var(--mud-palette-primary) 6%, transparent); }
.alert { display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:var(--lms-radius-control); font-size:14px; border:1px solid currentColor; }
.alert-info { color:var(--mud-palette-info); background:color-mix(in srgb, var(--mud-palette-info) 6%, transparent); }
.alert-warning { color:var(--mud-palette-warning); background:color-mix(in srgb, var(--mud-palette-warning) 7%, transparent); }
.alert .t { color:var(--mud-palette-text-primary); }
.alert-error { color:var(--mud-palette-error); background:color-mix(in srgb, var(--mud-palette-error) 6%, transparent); }
.alert-success { color:var(--mud-palette-success); background:color-mix(in srgb, var(--mud-palette-success) 7%, transparent); }
.lms-stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:16px; margin-block-end:20px; }
.lms-stat { display:flex; justify-content:space-between; gap:12px; padding:16px 20px; }
.lms-stat-label { font-size:13px; font-weight:500; color:var(--mud-palette-text-secondary); }
.lms-stat-value { font-size:28px; font-weight:700; line-height:1.2; font-variant-numeric:tabular-nums; }
.dialog-wrap { position:relative; min-block-size:100vh; background:var(--mud-palette-overlay-dark); display:grid; place-items:start center; padding:48px 16px; }
.dialog { inline-size:min(720px, 100%); background:var(--mud-palette-surface); border-radius:var(--lms-radius-surface); box-shadow:var(--lms-shadow-2); }
.dialog-head { display:flex; align-items:center; gap:12px; padding:18px 24px 8px; }
.dialog-body { padding:8px 24px 16px; display:flex; flex-direction:column; gap:18px; }
.dialog-actions { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:8px; padding:12px 24px 20px; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.num { font-variant-numeric:tabular-nums; direction:ltr; unicode-bidi:isolate; }
.tabs { display:flex; gap:4px; border-block-end:1px solid var(--mud-palette-lines-default); margin-block-end:20px; overflow-x:auto; }
.tab { padding:10px 14px; font-size:14px; font-weight:500; color:var(--mud-palette-text-secondary); border-block-end:2px solid transparent; white-space:nowrap; }
.tab[aria-current] { color:var(--mud-palette-primary); border-color:var(--mud-palette-primary); }
.row-actions { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }

/* Chips use the palette hover tint, as MudBlazor's Text chips do (HoverOpacity 0.06 light / 0.08 dark): status text stays >= 4.5:1. */
.chip-success { background:color-mix(in srgb, var(--mud-palette-success) 6%, var(--mud-palette-surface)); }
.chip-info { background:color-mix(in srgb, var(--mud-palette-info) 6%, var(--mud-palette-surface)); }
.chip-warning { background:color-mix(in srgb, var(--mud-palette-warning) 6%, var(--mud-palette-surface)); }
.chip-error { background:color-mix(in srgb, var(--mud-palette-error) 6%, var(--mud-palette-surface)); }
:root[data-theme=dark] .chip-success { background:color-mix(in srgb, var(--mud-palette-success) 8%, var(--mud-palette-surface)); }
:root[data-theme=dark] .chip-info { background:color-mix(in srgb, var(--mud-palette-info) 8%, var(--mud-palette-surface)); }
:root[data-theme=dark] .chip-warning { background:color-mix(in srgb, var(--mud-palette-warning) 8%, var(--mud-palette-surface)); }
:root[data-theme=dark] .chip-error { background:color-mix(in srgb, var(--mud-palette-error) 8%, var(--mud-palette-surface)); }

/* ---------- M5 additions (proposed lms-stitch.css block; see the spec, section 9) ---------- */
/* Gradebook grid */
.lms-gb-wrap { overflow:auto; max-block-size:560px; scroll-padding-block-start:76px; scroll-padding-inline-start:220px; border-radius:0 0 var(--lms-radius-surface) var(--lms-radius-surface); }
.lms-gb { border-collapse:separate; border-spacing:0; font-size:13.5px; min-inline-size:100%; }
.lms-gb th, .lms-gb td { padding:0 8px; block-size:36px; border-block-end:1px solid var(--mud-palette-table-lines); border-inline-end:1px solid var(--mud-palette-table-lines); white-space:nowrap; text-align:center; background:var(--mud-palette-surface); }
.lms-gb thead th { position:sticky; z-index:2; background:var(--mud-palette-background-gray); font-weight:600; font-size:12.5px; color:var(--mud-palette-text-secondary); }
.lms-gb thead tr:first-child th { inset-block-start:0; block-size:34px; }
.lms-gb thead tr:nth-child(2) th { inset-block-start:34px; block-size:42px; line-height:1.25; }
.lms-gb .lms-gb-student { position:sticky; inset-inline-start:0; z-index:1; text-align:start; min-inline-size:180px; font-weight:500; }
.lms-gb thead .lms-gb-student { z-index:3; }
.lms-gb .lms-gb-cat { color:var(--mud-palette-text-primary); text-align:start; }
.lms-gb .lms-gb-catres, .lms-gb .lms-gb-final { background:color-mix(in srgb, var(--mud-palette-primary) 5%, var(--mud-palette-surface)); font-weight:600; }
.lms-gb .lms-gb-final { border-inline-start:2px solid var(--mud-palette-lines-default); }
.lms-gb td.cell { position:relative; font-variant-numeric:tabular-nums; }
.lms-gb td.cell .src { font-size:14px; color:var(--mud-palette-text-secondary); margin-inline-start:4px; }
.lms-gb td.override::after { content:''; position:absolute; inset-block-start:0; inset-inline-end:0; border-style:solid; border-width:0 10px 10px 0; border-color:transparent var(--mud-palette-warning) transparent transparent; }
[dir=rtl] .lms-gb td.override::after { border-width:0 0 10px 10px; border-color:transparent transparent transparent var(--mud-palette-warning); }
.lms-gb td.focus-cell { outline:2px solid var(--mud-palette-primary); outline-offset:-2px; box-shadow:inset 0 0 0 4px var(--mud-palette-surface); z-index:1; }
.lms-gb td.editing { padding:3px; }
.lms-gb td.editing .input { min-height:28px; padding:2px 8px; justify-content:center; border-color:var(--mud-palette-primary); box-shadow:0 0 0 3px color-mix(in srgb, var(--mud-palette-primary) 25%, transparent); }
.lms-gb td.saving { color:var(--mud-palette-text-secondary); }
.lms-gb td.error { color:var(--mud-palette-error); font-weight:600; }
.lms-gb .mini { font-size:11px; font-weight:600; padding:1px 6px; border-radius:999px; }
.lms-gb .mini-warn { color:var(--mud-palette-warning); background:color-mix(in srgb, var(--mud-palette-warning) 14%, transparent); }
.lms-gb .mini-muted { color:var(--mud-palette-text-secondary); background:var(--mud-palette-background-gray); }
.lms-gb-hdr { display:flex; flex-direction:column; align-items:center; gap:2px; }
.lms-gb-hdr span { white-space:normal; max-inline-size:110px; }
.lms-gb-hdr small { font-weight:500; color:var(--mud-palette-text-secondary); font-size:11.5px; }
.lms-gb-legend { display:flex; flex-wrap:wrap; gap:8px 18px; padding:10px 16px; font-size:12.5px; color:var(--mud-palette-text-secondary); border-block-start:1px solid var(--mud-palette-lines-default); }
.lms-gb-legend span { display:inline-flex; gap:6px; align-items:center; }
.lms-weights-chip { font-variant-numeric:tabular-nums; }
/* Student-first list (under 600 px) */
.lms-gb-picker { display:flex; align-items:center; gap:8px; padding:12px; border-block-end:1px solid var(--mud-palette-lines-default); }
.lms-gb-picker .who { flex:1; min-inline-size:0; text-align:center; }
.lms-gb-item { display:flex; align-items:center; gap:10px; padding:10px 14px; border-block-end:1px solid var(--mud-palette-table-lines); min-block-size:52px; }
.lms-gb-item .t { flex:1; min-inline-size:0; } .lms-gb-item .t small { display:block; color:var(--mud-palette-text-secondary); font-size:12px; }
.lms-gb-item .score { inline-size:84px; }
/* Scales */
.lms-coverage { display:flex; block-size:36px; border-radius:var(--lms-radius-control); overflow:hidden; border:1px solid var(--mud-palette-lines-default); }
.lms-coverage span { display:grid; place-items:center; font-size:12px; font-weight:600; color:var(--mud-palette-text-primary); border-inline-end:1px solid var(--mud-palette-surface); min-inline-size:0; overflow:hidden; white-space:nowrap; }
.lms-coverage .gap { background:repeating-linear-gradient(45deg, color-mix(in srgb, var(--mud-palette-error) 25%, transparent) 0 6px, transparent 6px 12px); color:var(--mud-palette-error); }
.lms-coverage-axis { display:flex; justify-content:space-between; font-size:11.5px; color:var(--mud-palette-text-secondary); direction:ltr; }
/* Timetable */
.lms-tt { display:grid; gap:6px; }
.lms-tt-h { font-size:12.5px; font-weight:600; color:var(--mud-palette-text-secondary); text-align:center; padding:6px 0; }
.lms-tt-p { font-size:12.5px; color:var(--mud-palette-text-secondary); display:flex; flex-direction:column; justify-content:center; padding-inline:6px; }
.lms-tt-p b { color:var(--mud-palette-text-primary); font-weight:600; }
.lms-slot { min-block-size:76px; border-radius:var(--lms-radius-control); padding:8px 10px; background:var(--mud-palette-surface); border:1px solid var(--mud-palette-lines-default); border-inline-start:3px solid var(--mud-palette-primary); font-size:12.5px; display:flex; flex-direction:column; gap:2px; min-inline-size:0; }
.lms-slot b { font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.lms-slot .muted { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.lms-slot.empty { border:1px dashed var(--mud-palette-lines-default); background:transparent; display:grid; place-items:center; color:var(--mud-palette-text-secondary); }
.lms-slot.conflict { border-inline-start-color:var(--mud-palette-warning); }
.lms-slot.selected { outline:2px solid var(--mud-palette-primary); outline-offset:2px; }

    `<div class="card" style="overflow:visible"><div style="display:flex;flex-wrap:wrap;gap:8px 12px;padding:12px 16px;border-block-end:1px solid var(--mud-palette-lines-default)"><div class="input" style="flex:1 1 220px">${I('search')}<span class="ph-text">${S.search}</span></div><button class="btn btn-outlined" style="min-block-size:44px">${I('skip_next','flip')}${S.nextUn}</button></div>
    ${row(0,'p', live?I('videocam','ms-sm')+' '+S.liveSrc:'')}${row(1,'l', live?I('videocam','ms-sm')+' '+S.liveLate:`${I('sticky_note_2','ms-sm')} ${S.noteLate}`)}${row(2,'a','',true)}${row(3,'p', live?I('videocam','ms-sm')+' '+S.liveSrc:'')}${row(4,'', `<span style="color:var(--mud-palette-warning)">${I('radio_button_unchecked','ms-sm')} ${S.unmarked}</span>`)}${row(5,'e')}
    ${live ? `<div style="padding:14px 16px;border-block-start:1px solid var(--mud-palette-lines-default)"><div class="label" style="margin-block-end:8px">${S.unmatchedT}</div><div class="lms-check" style="flex-wrap:wrap">${I('person_off')}<span style="flex:1">${S.guest}</span><div class="input" style="inline-size:200px"><span class="ph-text">${S.thisIs}</span>${I('arrow_drop_down')}</div><button class="btn btn-sm">${S.skip}</button></div></div>` : ''}
    ${live ? '' : `<div class="lms-toast" role="status">${I('done_all')}<span style="flex:1">${S.undoT}</span><button class="btn btn-sm">${S.undo}</button></div>`}
    <div class="lms-att-bar" role="region" aria-label="Summary"><div class="counts" role="status">${chip(S.sumP,'chip-success')}${chip(S.sumA,'chip-error')}${chip(S.sumL,'chip-warning')}${chip(S.sumE,'chip-info')}${chip(S.sumU,'','radio_button_unchecked')}</div><span class="caption muted desk-only">${I('cloud_done','ms-sm')} ${S.online}</span><button class="btn btn-filled" style="min-block-size:44px">${live?S.confirmAtt:S.saveAtt}</button></div></div>`);
}
/* ---------- Excuses ---------- */
function excuseSubmit() {
  const steps = `<div class="lms-steps" aria-label="Steps"><span class="done"><b>${I('check','ms-sm')}</b>${S.exStep1}</span><i></i><span class="on" aria-current="step"><b>2</b>${S.exStep2}</span><i></i><span><b>3</b>${S.exStep3}</span></div>`;
  return `<div class="dialog-wrap"><div class="dialog" role="dialog"><div class="dialog-head"><span class="sec-icon">${I('assignment_late')}</span><div style="flex:1"><h2 class="h6">${S.exTitle}</h2><div class="caption muted">${S.exFor}</div></div><button class="icon-btn">${I('close')}</button></div>
  <div class="dialog-body">${steps}<div class="alert alert-info">${I('info')}<span class="t">${S.policy}</span></div>
  <fieldset style="border:0;padding:0;margin:0"><legend class="label" style="margin-block-end:8px">${S.covered}</legend>
  <div class="lms-check"><span class="box on">${I('check','ms-sm')}</span><span class="num" style="direction:inherit">${S.cov1}</span></div><div class="lms-check"><span class="box on">${I('check','ms-sm')}</span>${S.cov2}</div><div class="lms-check"><span class="box on">${I('check','ms-sm')}</span>${S.cov3}</div>
  <p class="help" style="margin-block-start:8px">${S.onlyNow}</p></fieldset>
  <fieldset style="border:0;padding:0;margin:0"><legend class="label" style="margin-block-end:8px">${S.reason}</legend><div class="seg" style="flex-wrap:wrap"><span aria-selected="true">${S.rIll}</span><span>${S.rFam}</span><span>${S.rOff}</span><span>${S.rOth}</span></div></fieldset>
  <div class="field"><span class="label">${S.details}</span><div class="input" style="min-height:72px"></div></div>
  <div class="field"><span class="label">${S.attach}</span><div><button class="btn btn-outlined btn-sm">${I('attach_file')}${S.choose}</button></div><span class="help">${S.attachH}</span></div></div>
  <div class="dialog-actions"><button class="btn" style="margin-inline-end:auto">${I('arrow_back','flip')}${S.back}</button><button class="btn">${S.cancel}</button><button class="btn btn-filled">${S.submit}</button></div></div></div>`;
}
function excuseReview() {
  const r = (s, b, rs, n, d, age, att, sel) => `<tr ${sel?'style="background:color-mix(in srgb, var(--mud-palette-primary) 6%, transparent)"':''}><td data-label="${S.colStudent}"><b>${s}</b></td><td data-label="${S.colSubmitter}">${b}</td><td data-label="${S.colReason}">${rs} ${att?I('attach_file','ms-sm muted'):''}</td><td data-label="${S.colSessions}" class="num">${n}</td><td data-label="${S.colDate}" class="num">${d}</td><td data-label="${S.colAge}">${age}</td></tr>`;
  const hist = 'PPAPPLPPPPPAPPPPEPPPPAPPLPPPPA'.split('').map(c => `<span class="h-${c.toLowerCase()}" title="${S['h'+c]}">${S['h'+c]}</span>`).join('');
  const drawer = `<aside class="card" aria-labelledby="dr"><div class="card-head"><span class="sec-icon">${I('assignment_late')}</span><div style="flex:1"><h2 class="h6" id="dr">${S.drawerT}</h2><div class="caption muted">${S.r1b} · ${S.rIll}</div></div>${chip(S.stSub,'chip-info chip-dot')}</div>
    <div class="card-body" style="display:flex;flex-direction:column;gap:14px">
    <div><div class="label" style="margin-block-end:6px">${S.covered}</div><div class="lms-check">${I('event_busy','ms-sm')}${S.cov1}</div><div class="lms-check">${I('event_busy','ms-sm')}${S.cov2}</div><div class="lms-check">${I('schedule','ms-sm')}${S.cov3}</div></div>
    <div><div class="label" style="margin-block-end:6px">${S.attach}</div><div class="lms-check" style="flex-wrap:wrap"><span style="inline-size:64px;block-size:48px;border-radius:6px;background:linear-gradient(135deg,var(--mud-palette-background-gray),var(--lms-recessed));display:grid;place-items:center">${I('image')}</span><span style="flex:1"><span class="num" style="direction:ltr">${S.docT}</span><div class="help">${S.docH}</div></span><button class="icon-btn sm" aria-label="Download">${I('download')}</button></div></div>
    <div><div class="label" style="margin-block-end:6px">${S.hist}</div><div class="lms-history" dir="ltr" role="img" aria-label="${S.hist}: ${S.stAbs} 4, ${S.stLate} 2, ${S.stExc} 1">${hist}</div><div class="help" style="margin-block-start:4px">${S.histKey}</div></div>
    <div class="field"><span class="label">${S.rejComment}</span><div class="input" style="min-height:60px"></div></div>
    <div class="alert alert-success">${I('verified')}<span class="t">${S.approveNote}</span></div>
    <div class="row-actions" style="justify-content:flex-end"><button class="btn btn-outlined">${I('trending_up')}${S.escalate}</button><button class="btn btn-outlined btn-error">${S.reject}</button><button class="btn btn-filled">${S.approve}</button></div></div></aside>`;
  return shell('exc', header(S.rvTitle, S.rvSub) + `<div class="lms-review"><div class="card"><div style="padding:12px 16px;border-block-end:1px solid var(--mud-palette-lines-default)"><div class="seg"><span aria-selected="true">${S.stSub}</span><span>${S.stEsc}</span><span>${S.stApp}</span><span>${S.stRej}</span></div></div>
    <table class="stack"><thead><tr><th>${S.colStudent}</th><th>${S.colSubmitter}</th><th>${S.colReason}</th><th>${S.colSessions}</th><th>${S.colDate}</th><th>${S.colAge}</th></tr></thead><tbody>
    ${r(S.r1s,S.r1b,S.rIll,'3','2026-11-13',S.d1,1,1)}${r(S.r2s,S.r2b,S.rFam,'1','2026-11-15',S.d2,0)}${r(S.r3s,S.r3b,S.rOff,'2','2026-11-14',S.d3,1)}</tbody></table></div>${drawer}</div>`);
}
function alerts() {
  const r = (s, f, d) => `<tr><td data-label="${S.colStudent}"><b>${s}</b></td><td data-label="${lang==='ar'?'الحساب':'Count'}"><span class="num" style="direction:inherit">${f}</span></td><td data-label="${lang==='ar'?'التاريخ':'Date'}">${d}</td><td><button class="btn btn-sm">${S.open2}</button></td></tr>`;
  return shell('al', header(S.alTitle, S.alSub) + `<div class="lms-stats"><div class="card lms-stat"><div><div class="lms-stat-label">${lang==='ar'?'طلاب فوق الحد':'Students over the threshold'}</div><div class="lms-stat-value">3</div></div><span class="sec-icon">${I('notification_important')}</span></div><div class="card lms-stat"><div><div class="lms-stat-label">${lang==='ar'?'جديدة هذا الأسبوع':'New this week'}</div><div class="lms-stat-value">1</div></div><span class="sec-icon">${I('today')}</span></div></div>
    <div class="card"><table class="stack"><thead><tr><th>${S.colStudent}</th><th>${lang==='ar'?'الحساب':'Count'}</th><th>${lang==='ar'?'التاريخ':'Date'}</th><th><span class="vh">…</span></th></tr></thead><tbody>
    ${r(S.r1s, S.formula, S.alDate)}${r(S.r3s, lang==='ar'?'5 غيابات + 0 تأخير = 5':'5 absences + 0 lates = 5', S.alDate)}${r(S.s5+' · 10-A', lang==='ar'?'3 غيابات + 4 تأخيرات × ½ = 5':'3 absences + 4 lates × ½ = 5', S.alDate)}</tbody></table></div>`);
}

function myAttendance() {
  const row = (d, st, ex) => `<div class="lms-absence"><div class="t"><span class="num" style="direction:inherit">${d}</span></div>${chip(st[0], st[1], st[2])}${ex}</div>`;
  const absent = [S.absTxt,'chip-error','cancel'], late = [S.lateTxt,'chip-warning','schedule'], exc = [S.excTxt,'chip-info','verified'];
  return shell('att', header(S.maTitle, S.maSub) +
    `<div class="row-actions" style="margin-block-end:16px;align-items:flex-end"><div class="field"><span class="label">${S.child}</span><div class="seg"><span aria-selected="true">${S.s1}</span><span>${S.s2}</span></div></div>
      <div class="field"><span class="label">${S.range}</span><div class="input" style="min-inline-size:240px"><span class="num">${S.rangeV}</span><span class="ph-text"></span>${I('date_range')}</div></div></div>
    <div class="lms-stats"><div class="card lms-stat"><div><div class="lms-stat-label">${S.stAbs}</div><div class="lms-stat-value">3</div></div><span class="sec-icon">${I('cancel')}</span></div><div class="card lms-stat"><div><div class="lms-stat-label">${S.stLate}</div><div class="lms-stat-value">1</div></div><span class="sec-icon">${I('schedule')}</span></div><div class="card lms-stat"><div><div class="lms-stat-label">${S.stExc}</div><div class="lms-stat-value">1</div></div><span class="sec-icon">${I('verified')}</span></div></div>
    <div class="card">
    ${row(S.a1, absent, `<button class="btn btn-outlined btn-sm" style="min-block-size:44px">${S.explain}</button>`)}
    ${row(S.a2, absent, chip(S.exSubmitted,'chip-info chip-dot'))}
    ${row(S.a3, late, `<button class="btn btn-outlined btn-sm" style="min-block-size:44px">${S.explain}</button>`)}
    ${row(S.a4, exc, chip(S.exApproved,'chip-success chip-dot'))}
    ${row(S.a5, absent, `<span class="caption muted">${I('lock','ms-sm')} ${S.windowClosed}</span>`)}
    </div>`);
}
function states() {
  const st = (icon, t, d, action='', cls='') => `<div class="card lms-state ${cls}"><span class="sec-icon">${I(icon)}</span><b>${t}</b><p class="muted" style="max-inline-size:360px">${d}</p>${action}</div>`;
  return shell('att', header(S.statesTitle, '') + `<div style="display:grid;grid-template-columns:repeat(auto-fill, minmax(300px,1fr));gap:16px">
    ${st('schedule', S.stNoPeriods, S.stNoPeriodsT, `<button class="btn btn-filled">${S.addPeriods}</button>`)}
    ${st('unpublished', S.stNotPub, S.stNotPubT)}
    ${st('event_busy', S.stNoSess, S.stNoSessT)}
    ${st('group_off', S.stNoStu, S.stNoStuT)}
    ${st('inbox', S.stQueue, S.stQueueT)}
    ${st('notifications_none', S.stAlerts, S.stAlertsT)}
    <div class="card" style="padding:16px;display:flex;flex-direction:column;gap:10px"><div class="caption muted">${S.stLoading}</div>${[1,2,3].map(() => `<div style="block-size:64px;border-radius:12px;background:var(--mud-palette-background-gray)"></div>`).join('')}</div>
    <div class="card" style="padding:16px"><div class="alert alert-error" role="alert">${I('error')}<span class="t" style="flex:1">${S.stError}</span><button class="btn btn-sm btn-outlined">${S.retry}</button></div></div>
    <div class="card" style="padding:16px"><div class="alert alert-warning" role="alert">${I('sync_problem')}<span class="t">${S.stConflict}</span></div></div>
    </div>`);
}
const screens = { gradebook, publish, scales, 'scale-edit':scaleEdit, weights, 'my-grades':myGrades, timetable, 'attendance-today':attendanceToday, 'attendance-take':() => attendanceTake(false), 'attendance-live':() => attendanceTake(true), 'excuse-submit':excuseSubmit, 'excuse-review':excuseReview, alerts, 'my-attendance':myAttendance, states };
document.getElementById('app').innerHTML = (screens[screen] || gradebook)();
</script>
</body>
</html>
