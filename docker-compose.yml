# Local infrastructure. Dev-only credentials; never reuse in production.
services:
  mysql:
    image: mysql@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902  # mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: lms_root_pw
      MYSQL_DATABASE: lms
      MYSQL_USER: lms
      MYSQL_PASSWORD: lms_dev_pw
    ports:
      - "${LMS_MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # TCP + app user + real query: during first-time init MySQL runs a temporary server on the
      # socket only, which answers `mysqladmin ping -h localhost` before the real server is up (CI race).
      test: ["CMD", "mysql", "-h", "127.0.0.1", "-P", "3306", "-ulms", "-plms_dev_pw", "-e", "SELECT 1", "lms"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  minio:
    # Upstream minio/minio is no longer published on Docker Hub; chainguard/minio is a maintained build.
    image: chainguard/minio@sha256:fb893e36fc369d41e92f678b17ec27378fa5bf0576aeef7ac15460c13629ab5a
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lms_minio
      MINIO_ROOT_PASSWORD: lms_minio_dev_pw
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  mailpit:
    image: axllent/mailpit@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce  # see docs/adr/0002-minio-image.md
    ports:
      - "1025:1025"
      - "8025:8025"

  # External OpenID Connect provider for local development and the identity-provider E2E tests (M2 Task 22).
  # Interactive login: the sign-in page lets you type a username and the claims JSON (sub, email, ...).
  # Issuer: http://localhost:8090/client-a. The same image digest is used by MockOidcServer in the integration tests.
  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server@sha256:65d4ed47ce094cc3849e41e03499bfb32372d69c726ec22b3d5a19eba9bc787e
    environment:
      SERVER_PORT: "8080"
      JSON_CONFIG: '{"interactiveLogin": true}'
    ports:
      - "8090:8080"

volumes:
  mysql-data:
  minio-data: